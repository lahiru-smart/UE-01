<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid - Learn 09</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>09) Justify Items / Align Items / Place Items</h1>
    <h2>Vertical and Horizontal Aligning Items</h2>
    <h3>X axis- {justify-items: start/end/center}</h3>
    <h3>Y axis- {align-items: start/end/center}</h3>
    <h3>Absolute Center- {place-items: center}</h3>

    <h4>For child elements - {justify-self} {align-self}</h4>
    <div class="container grid-9">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
    </div>
  </body>
</html>
