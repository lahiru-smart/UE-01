<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid - Learn 05</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>5) Auto-fit and Auto-fill with minmax</h1>
    <h2>Making Responsive Columns</h2>
    <h3>{grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));}</h3>
    <h3>{grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));}</h3>

    <hr />
    <h2>auto-fit</h2>
    <div class="container grid-5 auto-fit">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
    </div>

    <h2>auto-fill</h2>
    <div class="container grid-5 auto-fill">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
    </div>
  </body>
</html>
