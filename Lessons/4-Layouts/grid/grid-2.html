<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid - Learn 02</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>2) Fraction Units and Repeat</h1>
    <h2>2.1) Fraction Units - {define width according to parent}</h2>
    <h3>1fr/2fr/....</h3>
    <div class="container grid-2">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
    </div>
    <br />
    <br />

    <h2>2.2) Repeat {grid-template: repeat(rows)/repeat(columns)}</h2>
    <div class="container grid-2-repeat">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
    </div>

    <br /><br />
    <h3>Shorthand method (L method)</h3>
    <strong>
      grid-template: rows/columns;<br />
      grid-template: repeat(2, 50px)/repeat(3, 1fr);
    </strong>
  </body>
</html>
